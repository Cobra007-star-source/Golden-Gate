function buildCityLights(roofPts) {
  const pts = [], cols = [];
  const push = (x, y, z, warm) => {
    pts.push(x, y, z);
    if (warm) cols.push(1.0, 0.62 + Math.random() * 0.15, 0.3);
    else cols.push(0.72, 0.84, 1.0);
  };
  // street-light carpet over the SF hills, laid out as a loose grid of streets
  for (let ix = 0; ix <= 73; ix++) {
    for (let iz = 0; iz <= 76; iz++) {
      if (ix % 3 !== 0 && iz % 3 !== 0) continue;
      if (Math.random() < 0.3) continue;
      const x = 470 + ix * 10 + (Math.random() - 0.5) * 3;
      const z = -280 + iz * 10 + (Math.random() - 0.5) * 3;
      if (x < 640 && Math.abs(z) < 70) continue;
      const g = groundY(x, z);
      if (g < 2.5 || g > 70) continue;
      push(x, WATER_LEVEL - 2 + g + 1.8, z, Math.random() < 0.82);
    }
  }
  // Sausalito twinkle on the Marin shoreline
  for (let i = 0; i < 260; i++) {
    const x = -470 + Math.random() * 230;
    const z = 290 + Math.random() * 180;
    const g = groundY(x, z);
    if (g < 2 || g > 46) continue;
    push(x, WATER_LEVEL - 2 + g + 1.6, z, Math.random() < 0.9);
  }
  const pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  pg.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  cityPointsMat = new THREE.PointsMaterial({
    size: 2.6, vertexColors: true, transparent: true, opacity: 0,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  });
  const p = new THREE.Points(pg, cityPointsMat);
  p.frustumCulled = false;
  scene.add(p);

  // red aviation beacons on the tallest rooftops
  if (roofPts.length) {
    const rg = new THREE.BufferGeometry();
    rg.setAttribute('position', new THREE.Float32BufferAttribute(roofPts, 3));
    roofPointsMat = new THREE.PointsMaterial({
      size: 3.6, color: 0xff2818, transparent: true, opacity: 0,
      blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
    });
    const rp = new THREE.Points(rg, roofPointsMat);
    rp.frustumCulled = false;
    scene.add(rp);
  }
}

function wheelGeo(x, z, r) {
  const w = new THREE.CylinderGeometry(r, r, 0.36, 10);
  w.rotateX(Math.PI / 2);
  w.translate(x, r, z);
  return w;
}
function mergeParts(parts) {
  const m = BufferGeometryUtils.mergeGeometries(parts, false);
  m.computeVertexNormals();
  return m;
}
function geoSedan() {
  const P = [], push = (g, x, y, z) => { g.translate(x, y, z); P.push(g); };
  push(new THREE.BoxGeometry(4.4, 0.85, 1.9), 0, 0.78, 0);
  push(new THREE.BoxGeometry(4.0, 0.4, 1.75), 0, 1.3, 0);
  push(new THREE.BoxGeometry(2.2, 0.75, 1.65), -0.1, 1.78, 0);
  push(new THREE.BoxGeometry(1.8, 0.15, 1.5), -0.12, 2.2, 0);
  for (const [wx, wz] of [[1.45, -0.95], [1.45, 0.95], [-1.45, -0.95], [-1.45, 0.95]]) P.push(wheelGeo(wx, wz, 0.42));
  return mergeParts(P);
}
function geoSUV() {
  const P = [], push = (g, x, y, z) => { g.translate(x, y, z); P.push(g); };
  push(new THREE.BoxGeometry(4.7, 1.05, 1.95), 0, 0.98, 0);
  push(new THREE.BoxGeometry(3.0, 0.95, 1.85), -0.15, 1.95, 0);
  push(new THREE.BoxGeometry(2.6, 0.14, 1.7), -0.15, 2.48, 0);
  for (const [wx, wz] of [[1.5, -0.98], [1.5, 0.98], [-1.5, -0.98], [-1.5, 0.98]]) P.push(wheelGeo(wx, wz, 0.5));
  return mergeParts(P);
}
function geoBus() {
  const P = [], push = (g, x, y, z) => { g.translate(x, y, z); P.push(g); };
  push(new THREE.BoxGeometry(10.6, 2.5, 2.35), 0, 1.78, 0);
  push(new THREE.BoxGeometry(1.6, 0.32, 1.6), 1.8, 3.2, 0);
  push(new THREE.BoxGeometry(1.6, 0.32, 1.6), -2.2, 3.2, 0);
  for (const [wx, wz] of [[3.8, -1.0], [3.8, 1.0], [-3.6, -1.0], [-3.6, 1.0]]) P.push(wheelGeo(wx, wz, 0.52));

function geoTruck() {

function buildTraffic() {

  // 6 lanes, 3 per direction

    { z: -6.6, dir: 1 }, { z: -4.0, dir: 1 }, { z: -1.4, dir: 1 },
    { z: 1.4, dir: -1 }, { z: 4.0, dir: -1 }, { z: 6.6, dir: -1 },
  ];
  laneGroups = lanes.map(() => []);
  const ring = ROAD_END * 2;
  // cumulative type selection
  const cum = []; let acc = 0;
  for (const v of VEH) { acc += v.frac; cum.push(acc); }
  for (let i = 0; i < MAX_CARS; i++) {
    const li = i % lanes.length;
    const lane = lanes[li];
    const r = Math.random();
    let type = 0;
    while (type < cum.length - 1 && r > cum[type]) type++;
    const heavy = VEH[type].heavy;
    const speed = heavy ? 16 + Math.random() * 7 : 24 + Math.random() * 15;
    const c = {
      x: -ROAD_END + Math.random() * ring,
      z: lane.z + (Math.random() - 0.5) * 0.5,
      dir: lane.dir, lane: li, idx: i, type,
      len: VEH[type].len,
      speed, curSpeed: speed,
      color: new THREE.Color(carColors[(Math.random() * carColors.length) | 0]),
    };
    cars.push(c);
    laneGroups[li].push(c);
    vehicleMeshes[type].setColorAt(i, c.color);
  }
  for (const m of vehicleMeshes) if (m.instanceColor) m.instanceColor.needsUpdate = true;

  layoutCars();
  updaters.push((dt) => {
    updateTraffic(dt);
    layoutCars();
  });
}

// Car-following: faster cars queue behind slower ones instead of clipping.
function updateTraffic(dt) {
  const ring = ROAD_END * 2;
  for (let i = 0; i < activeCars; i++) cars[i].curSpeed = cars[i].speed;
  for (const group of laneGroups) {
    const arr = [];
    for (const c of group) { if (c.idx < activeCars) arr.push(c); }
    if (arr.length < 2) { for (const c of arr) advanceCar(c, dt, ring); continue; }
    const dir = arr[0].dir;
    const S = (c) => dir > 0 ? c.x : -c.x;
    for (const c of arr) advanceCar(c, dt, ring);
    arr.sort((a, b) => S(a) - S(b)); // rear -> front
    for (let k = arr.length - 2; k >= 0; k--) {
      const me = arr[k], lead = arr[k + 1];
      const need = (me.len + lead.len) / 2 + 1.6;
      if (S(lead) - S(me) < need) {
        const s = S(lead) - need;
        me.x = dir > 0 ? s : -s;
      }
    }
    const rear = arr[0], front = arr[arr.length - 1];
    const needW = (rear.len + front.len) / 2 + 1.6;
    if ((S(front) + ring) - S(rear) < needW) {
      const s = S(front) + ring - needW;
      rear.x = dir > 0 ? s : -s;
      if (rear.x > ROAD_END) rear.x -= ring;
      if (rear.x < -ROAD_END) rear.x += ring;
    }
  }
}
function advanceCar(c, dt, ring) {
  c.x += c.dir * c.curSpeed * dt;
  if (c.x > ROAD_END) c.x -= ring;
  if (c.x < -ROAD_END) c.x += ring;
}

function layoutCars() {
  const n = activeCars;
  const showLights = state.nightFactor > 0.22;
  const zero = () => {
    tmpObj.position.set(0, -9999, 0);
    tmpObj.rotation.set(0, 0, 0);
    tmpObj.scale.set(0.0001, 0.0001, 0.0001);
    tmpObj.updateMatrix();
    return tmpObj.matrix;
  };
  for (let ti = 0; ti < VEH.length; ti++) {
    const mesh = vehicleMeshes[ti];
    for (let i = 0; i < MAX_CARS; i++) {
      const c = cars[i];
      if (i < n && c.type === ti) {
        tmpObj.position.set(c.x, CAR_Y, c.z);
        tmpObj.rotation.set(0, c.dir > 0 ? 0 : Math.PI, 0);
        tmpObj.scale.set(1, 1, 1);
        tmpObj.updateMatrix();
        mesh.setMatrixAt(i, tmpObj.matrix);
      } else {
        mesh.setMatrixAt(i, zero());
      }
    }
    mesh.instanceMatrix.needsUpdate = true;
  }
  const lz = 0.68;
  for (let i = 0; i < MAX_CARS; i++) {
    if (i < n) {
      const c = cars[i];
      const fwd = c.dir;
      const half = c.len / 2;
      const ls = showLights ? 1 : 0.0001;
      for (let k = 0; k < 2; k++) {
        const zz = c.z + (k === 0 ? lz : -lz);
        tmpObj.position.set(c.x + fwd * (half - 0.05), CAR_Y + 0.62, zz);
        tmpObj.rotation.set(0, 0, 0);
        tmpObj.scale.set(ls, ls, ls);
        tmpObj.updateMatrix(); headMesh.setMatrixAt(i * 2 + k, tmpObj.matrix);
        tmpObj.position.set(c.x - fwd * (half - 0.05), CAR_Y + 0.62, zz);
        tmpObj.updateMatrix(); tailMesh.setMatrixAt(i * 2 + k, tmpObj.matrix);
      }
      tmpObj.position.set(c.x + fwd * (half + 3.6), DECK_TOP + 0.06, c.z);
      tmpObj.rotation.set(0, c.dir > 0 ? 0 : Math.PI, 0);
      tmpObj.scale.set(9, 1, 4.6);
      tmpObj.updateMatrix(); poolMesh.setMatrixAt(i, tmpObj.matrix);
    } else {
      const zm = zero();
      headMesh.setMatrixAt(i * 2, zm); headMesh.setMatrixAt(i * 2 + 1, zm);
      tailMesh.setMatrixAt(i * 2, zm); tailMesh.setMatrixAt(i * 2 + 1, zm);
      poolMesh.setMatrixAt(i, zm);
    }
  }
  headMesh.instanceMatrix.needsUpdate = true;
  tailMesh.instanceMatrix.needsUpdate = true;
  poolMesh.instanceMatrix.needsUpdate = true;
}

// ---- Ships: cargo vessels steaming through the Golden Gate ----
let ships = [], shipWinMat = null;
function buildShips() {
  const hullMat = new THREE.MeshStandardMaterial({ color: 0x2a3340, roughness: 0.8, metalness: 0.3 });
  const deckHouseMat = new THREE.MeshStandardMaterial({ color: 0xdadfe6, roughness: 0.7 });
  const containerColors = [0xb33b2f, 0x2f5fb3, 0x3aa05a, 0xc9a227, 0x55607a, 0xa84a92];
  shipWinMat = new THREE.MeshStandardMaterial({ color: 0x202830, emissive: 0xffd9a0, emissiveIntensity: 0, roughness: 0.5 });

  function navLight(rgb) {
    const m = new THREE.MeshBasicMaterial({ fog: false });
    m.color.setRGB(rgb[0], rgb[1], rgb[2]);
    return new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), m);
  }
  function makeShip(scale) {
    const g = new THREE.Group();
    const hull = new THREE.Mesh(new THREE.BoxGeometry(46, 7, 13), hullMat);
    hull.position.y = 3.2; hull.castShadow = true; g.add(hull);
    const bow = new THREE.Mesh(new THREE.BoxGeometry(9, 6.4, 13), hullMat);
    bow.position.set(27, 3.4, 0); bow.scale.set(1, 1, 0.42); bow.rotation.y = 0; g.add(bow);
    const stern = new THREE.Mesh(new THREE.BoxGeometry(5, 5.6, 11), hullMat);
    stern.position.set(-25, 3.0, 0); stern.scale.set(1, 1, 0.7); g.add(stern);
    // container stacks
    for (let r = 0; r < 6; r++) {
      for (let c = 0; c < 2; c++) {
        const hN = 1 + (Math.random() * 2 | 0);
        for (let s2 = 0; s2 < hN; s2++) {
          const cm = new THREE.MeshStandardMaterial({ color: containerColors[(Math.random() * containerColors.length) | 0], roughness: 0.9 });
          const bx = new THREE.Mesh(new THREE.BoxGeometry(5.8, 3, 5), cm);
          bx.position.set(-14 + r * 6, 8.2 + s2 * 3.2, -3 + c * 6);
          bx.castShadow = true; g.add(bx);
        }
      }
    }
    // bridge house at stern with lit windows
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(6.5, 10.5, 12), deckHouseMat);
    cabin.position.set(-19, 11.8, 0); cabin.castShadow = true; g.add(cabin);
    const win = new THREE.Mesh(new THREE.BoxGeometry(0.4, 2.0, 11), shipWinMat);
    win.position.set(-15.6, 15.6, 0); g.add(win);
    const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.35, 6, 6), deckHouseMat);
    mast.position.set(-19, 19.5, 0); g.add(mast);
    // nav lights: red port, green starboard, white masthead
    const red = navLight([5, 0.4, 0.25]); red.position.set(20, 8.6, -6.8); g.add(red);
    const green = navLight([0.3, 4.5, 1.2]); green.position.set(20, 8.6, 6.8); g.add(green);
    const white = navLight([4.5, 4.2, 3.2]); white.position.set(-19, 22.8, 0); g.add(white);
    g.userData.navMeshes = [red, green, white];
    // foam wake trailing aft
    const wakeGeo = new THREE.PlaneGeometry(13, 70);
    wakeGeo.rotateX(-Math.PI / 2);
    wakeGeo.rotateY(-Math.PI / 2); // white end of the texture sits at the stern
    const wake = new THREE.Mesh(wakeGeo, new THREE.MeshBasicMaterial({
      map: TEX.wake, transparent: true, opacity: 0.5, depthWrite: false,
    }));
    wake.position.set(-60, 0.55, 0);
    g.add(wake);
    g.scale.setScalar(scale);
    return g;
  }

  // shipping lanes run along z, straight through the gate between the towers
  const routes = [
    { x: -62, dir: 1,  speed: 17, scale: 0.85, z: -900 },
    { x:  28, dir: -1, speed: 13, scale: 0.9,  z:  700 },
    { x: 112, dir: 1,  speed: 21, scale: 0.7,  z: -150 },
  ];
  for (const r of routes) {
    const ship = makeShip(r.scale);
    scene.add(ship);
    ships.push({ obj: ship, ...r });
  }

  updaters.push((dt, t) => {
    for (const s of ships) {
      s.z += s.dir * s.speed * dt;
      if (s.z > 1500) s.z = -1500;
      if (s.z < -1500) s.z = 1500;
      // model forward is +x; heading for motion along ±z
      const heading = Math.atan2(-s.dir, 0);
      s.obj.position.set(s.x, WATER_LEVEL + Math.sin(t * 0.7 + s.x) * 0.45, s.z);
      s.obj.rotation.set(Math.sin(t * 0.5 + s.x) * 0.01, heading, Math.sin(t * 0.6 + s.x) * 0.012);
    }
  });
}

// ---- Birds (lightweight flocking, instanced) ----
let birdMesh, birds = [], birdWingPhase = 0;
const BIRD_COUNT = 42;
function buildBirds() {
  const geo = new THREE.BufferGeometry();
  const verts = new Float32Array([0, 0, 0, -2.2, 0.3, -1.4, -2.2, 0.3, 1.4]);
  geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshStandardMaterial({ color: 0x1c1f26, roughness: 1, side: THREE.DoubleSide, flatShading: true });
  birdMesh = new THREE.InstancedMesh(geo, mat, BIRD_COUNT);
  birdMesh.frustumCulled = false;
  scene.add(birdMesh);

  const center = new THREE.Vector3(0, 120, -80);
  for (let i = 0; i < BIRD_COUNT; i++) {
    birds.push({
      pos: new THREE.Vector3(center.x + (Math.random() - 0.5) * 120, center.y + (Math.random() - 0.5) * 40, center.z + (Math.random() - 0.5) * 120),
      vel: new THREE.Vector3((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 2, (Math.random() - 0.5) * 8),
    });
  }

  const tmp = new THREE.Vector3(), sep = new THREE.Vector3(), ali = new THREE.Vector3(), coh = new THREE.Vector3();
  const q = new THREE.Quaternion(), xAxis = new THREE.Vector3(1, 0, 0);
  const flockCenter = new THREE.Vector3(0, 120, -70);

  updaters.push((dt) => {
    birdWingPhase += dt * 14;
    for (let i = 0; i < BIRD_COUNT; i++) {
      const b = birds[i];
      sep.set(0, 0, 0); ali.set(0, 0, 0); coh.set(0, 0, 0);
      let cnt = 0;
      for (let j = 0; j < BIRD_COUNT; j++) {
        if (i === j) continue;
        const o = birds[j];
        const d = b.pos.distanceTo(o.pos);
        if (d < 30 && d > 0) {
          tmp.subVectors(b.pos, o.pos).divideScalar(d * d); sep.add(tmp);
          ali.add(o.vel); coh.add(o.pos); cnt++;
        }
      }
      if (cnt > 0) {
        ali.divideScalar(cnt).sub(b.vel).multiplyScalar(0.6);
        coh.divideScalar(cnt).sub(b.pos).multiplyScalar(0.015);
        sep.multiplyScalar(28);
      }
      tmp.subVectors(flockCenter, b.pos).multiplyScalar(0.004);
      b.vel.add(ali).add(coh).add(sep).add(tmp);
      b.vel.x += (Math.random() - 0.5) * 0.6;
      b.vel.z += (Math.random() - 0.5) * 0.6;
      const sp = b.vel.length();
      const max = 24, min = 10;
      if (sp > max) b.vel.multiplyScalar(max / sp);
      if (sp < min) b.vel.multiplyScalar(min / sp);
      b.pos.addScaledVector(b.vel, dt);
      if (b.pos.y < 70) b.vel.y += 2;
      if (b.pos.y > 200) b.vel.y -= 2;

      const dir = tmp.copy(b.vel).normalize();
      q.setFromUnitVectors(xAxis, dir);
      tmpObj.position.copy(b.pos);
      tmpObj.quaternion.copy(q);
      const flap = 0.5 + Math.abs(Math.sin(birdWingPhase + i)) * 0.9;
      tmpObj.scale.set(1.6, 1.6, flap * 1.6);
      tmpObj.updateMatrix();
      birdMesh.setMatrixAt(i, tmpObj.matrix);
    }
    birdMesh.instanceMatrix.needsUpdate = true;
  });
}

// ---- Volumetric-feeling fog sprites rolling through the gate ----
let fogData = [];
const FOG_COUNT = 110;
function buildFogParticles() {
  const group = new THREE.Group();
  for (let i = 0; i < FOG_COUNT; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: TEX.fogPuff, transparent: true, opacity: 0, depthWrite: false, fog: false,
    }));
    const x = (Math.random() - 0.5) * 1500;
    const z = (Math.random() - 0.5) * 1300;
    const y = WATER_LEVEL + 6 + Math.random() * 60;
    s.position.set(x, y, z);
    const sc = 130 + Math.random() * 240;
    s.scale.set(sc, sc * 0.55, 1);
    group.add(s);
    fogData.push({ s, baseX: x, drift: 4 + Math.random() * 9, phase: Math.random() * 10 });
  }
  scene.add(group);

  updaters.push((dt, t) => {
    const dens = params.fog / 100;
    const maxOp = 0.5 * dens;
    for (const f of fogData) {
      f.s.position.x = f.baseX + Math.sin(t * 0.05 + f.phase) * 40 + (t * f.drift) % 1500;
      if (f.s.position.x > 850) f.s.position.x -= 1700;
      f.s.material.opacity = maxOp * (0.5 + 0.5 * Math.sin(t * 0.1 + f.phase));
      f.s.material.color.copy(state.fogColor).lerp(new THREE.Color(0xffffff), 0.22);
    }
  });
}

// ---- Night orchestration: every light in the scene follows nightFactor ----
function updateNightLights() {
  const nf = state.nightFactor;
  const now = performance.now();
  for (const m of cityMats) m.emissiveIntensity = nf * 2.8;
  for (const m of landmarkEmissives) m.emissiveIntensity = nf * 2.6;
  if (lampMat) lampMat.emissiveIntensity = nf * 3.4;
  for (const bm of beaconLights) bm.emissiveIntensity = nf * (2.2 + Math.sin(now * 0.004) * 1.6);
  if (cityPointsMat) cityPointsMat.opacity = nf * 0.95;
  if (roofPointsMat) roofPointsMat.opacity = nf * (0.55 + 0.45 * Math.sin(now * 0.003));
  if (alcatrazBeaconMat) alcatrazBeaconMat.emissiveIntensity = nf * (Math.sin(now * 0.0035) > 0.55 ? 7 : 0.15);
  if (shipWinMat) shipWinMat.emissiveIntensity = nf * 2.2;
  if (poolMat) poolMat.opacity = nf * 0.5;
  for (const s of ships) {
    const meshes = s.obj.userData.navMeshes;
    if (meshes) for (const msh of meshes) msh.visible = nf > 0.2;
  }
}

function fmtTime(h) {
  const hh = Math.floor(h) % 24;
  const mm = Math.floor((h - Math.floor(h)) * 60);
  return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
}

// Camera zoom by scaling distance to target along current direction
let baseDist = null, zoomDirty = false, zoomTarget = 1;
function applyZoom() {
  if (baseDist === null) baseDist = camera.position.distanceTo(controls.target);
  if (zoomDirty) { zoomTarget = params.zoom; zoomDirty = false; }
  const dir = camera.position.clone().sub(controls.target);
  const dist = dir.length();
  const want = baseDist / zoomTarget;
  if (Math.abs(dist - want) > 0.5) {
    const newDist = THREE.MathUtils.lerp(dist, want, 0.1);
    dir.setLength(THREE.MathUtils.clamp(newDist, controls.minDistance, controls.maxDistance));
    camera.position.copy(controls.target).add(dir);
  }
}

    updateTimeOfDay(params.time);
  }
  params.fog = (shot.fog !== undefined) ? shot.fog : cine.saved.fog;
  scene.fog.density = 0.00012 + Math.pow(params.fog / 100, 1.6) * 0.0026;
  if (shot.init) shot.init(cine.state);
  syncSliders();
}

function enterCinematic() {
  if (cine.active) return;
  fadeEl = document.getElementById('fadeBlack');
  titleEl = document.getElementById('cineTitle');
  cine.saved = {
    time: params.time, fog: params.fog,
    pos: camera.position.clone(), tgt: controls.target.clone(),
  };
  cine.active = true; cine.idx = 0; cine.t = 0;
  controls.enabled = false;
  document.body.classList.add('cine');
  fadeEl.style.transition = '';
  fadeEl.style.opacity = 1;
  startShot(SHOTS[0]);
}

function exitCinematic() {
  if (!cine.active) return;
  cine.active = false;
  document.body.classList.remove('cine');
  params.time = cine.saved.time;
  params.fog = cine.saved.fog;
  updateTimeOfDay(params.time);
  scene.fog.density = 0.00012 + Math.pow(params.fog / 100, 1.6) * 0.0026;
  syncSliders();
  camera.position.copy(cine.saved.pos);
  controls.target.copy(cine.saved.tgt);
  camera.lookAt(controls.target);
  controls.enabled = true;
  if (titleEl) titleEl.style.opacity = 0;
  // graceful fade back into the interactive view
  if (fadeEl) {
    fadeEl.style.opacity = 1;
    requestAnimationFrame(() => {
      fadeEl.style.transition = 'opacity 0.9s ease';
      fadeEl.style.opacity = 0;
      setTimeout(() => { fadeEl.style.transition = ''; }, 950);
    });
  }
}

function updateCinematic(dt) {
  cine.t += dt;
  let shot = SHOTS[cine.idx];
  if (cine.t >= shot.dur) {
    cine.idx++;
    if (cine.idx >= SHOTS.length) { exitCinematic(); return; }
    cine.t -= shot.dur;
    shot = SHOTS[cine.idx];
    startShot(shot);
  }
  const t01 = THREE.MathUtils.clamp(cine.t / shot.dur, 0, 1);
  const e = shot.ease === false ? t01 : smooth01(t01);

  if (shot.timeRange) {
    params.time = L(shot.timeRange[0], shot.timeRange[1], t01);
    updateTimeOfDay(params.time);
    syncSliders();
  }

  shot.cam(e, _cPos, _cTgt, cine.state, t01);
  camera.position.copy(_cPos);
  cine.lookAt.copy(_cTgt);
  camera.lookAt(_cTgt);

  // black dip transition at every shot boundary
  const o = Math.max(1 - cine.t / 0.55, (cine.t - (shot.dur - 0.55)) / 0.55);
  fadeEl.style.opacity = THREE.MathUtils.clamp(o, 0, 1).toFixed(3);

  // title card on the opening shot: fade in, hold, fade out
  if (titleEl) {
    let to = 0;
    if (cine.idx === 0) {
      to = Math.min(smooth01((cine.t - 0.7) / 1.0), 1 - smooth01((cine.t - 4.6) / 1.4));
    }
    titleEl.style.opacity = THREE.MathUtils.clamp(to, 0, 1).toFixed(3);
  }
}

// ---- Animate + boot ----
let fpsAcc = 0, fpsFrames = 0, fpsEl;
let simTime = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  simTime += dt;

  for (const fn of updaters) fn(dt, simTime);
  updateNightLights();
  if (cine.active) {
    updateCinematic(dt);
  } else {
    applyZoom();
    controls.update();
  }
  finalPass.uniforms.uTime.value = simTime;

  envFrame++;
  // shadows refresh every other frame, IBL only when the sky actually changed
  // (during the timelapse shot the sky is dirty every frame — cap it at 1/3)
  if (envFrame % 2 === 0) renderer.shadowMap.needsUpdate = true;
  if (cubeCam && ((envDirty && envFrame % 3 === 0) || envFrame % 30 === 0)) { updateEnvironment(); envDirty = false; }

  renderReflection();
  composer.render();
  renderFlareOverlay();

  fpsAcc += dt; fpsFrames++;
  if (fpsAcc >= 0.5 && fpsEl) {
    fpsEl.textContent = Math.round(fpsFrames / fpsAcc) + ' FPS';
    fpsAcc = 0; fpsFrames = 0;
  }
}

function boot() {
  init();
  buildTextures();
  buildSky();
  buildLights();
  buildWater();
  buildTerrain();
  buildBridge();
  buildCity();
  buildTraffic();
  buildShips();
  buildBirds();
  buildFogParticles();
  wireUI();
  updateTimeOfDay(params.time);
  updateEnvironment();
  fpsEl = document.getElementById('fps');

  const loader = document.getElementById('loader');
  loader.classList.add('hide');
  setTimeout(() => loader.remove(), 700);

  animate();
}

// let the loader paint before the heavy synchronous build
requestAnimationFrame(() => setTimeout(boot, 30));
</script>
